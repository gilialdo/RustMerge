[package]
name = "rustmerge"
version = "0.1.0"
edition = "2024"
description = "Comparador de pastas e arquivos com interface egui"

[dependencies]
eframe = { version = "0.33", features = ["persistence"] }
similar = "2.7"
encoding_rs = "0.8"
rfd = "0.15"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = "thin"
